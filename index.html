<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Симулятор: Мошенники</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#0a0e14;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:16px}
.app{max-width:600px;width:100%;background:#151a22;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.8);overflow:hidden;border:1px solid #2a313c;position:relative;min-height:600px}
.intro{position:absolute;inset:0;background:linear-gradient(180deg,#0a0e14,#131a24);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:10;transition:opacity .5s}
.intro.hide{opacity:0;pointer-events:none}
.phone{width:220px;height:400px;background:#0f1318;border-radius:28px;border:3px solid #2a313c;position:relative;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.phone::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:60px;height:6px;background:#2a313c;border-radius:3px}
.phone-screen{flex:1;background:#0a0e14;border-radius:18px;padding:14px 10px;overflow:hidden;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.phone-title{color:#8b98a8;font-size:11px;text-align:center;letter-spacing:1px}
.notif{background:#1e2630;border:1px solid #2a313c;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;animation:notifIn .6s ease;cursor:pointer}
.notif:active{transform:scale(.97)}
@keyframes notifIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.notif .nicon{width:32px;height:32px;background:#d32f2f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.notif .ntext{flex:1;color:#c9d4e0;font-size:12px;line-height:1.3}
.notif .ntext strong{color:#e1e8ed;display:block;margin-bottom:2px;font-size:13px}
.notif .badge{background:#d32f2f;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px}
.intro .hint{color:#6c7a8a;font-size:13px}
.header{background:#0f1318;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2a313c}
.avatar{width:40px;height:40px;background:#2a313c;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#8b98a8}
.header-info{flex:1}
.header-info .name{color:#e1e8ed;font-weight:600;font-size:15px}
.header-info .status{color:#6c7a8a;font-size:12px}
.chat{padding:20px;min-height:340px;max-height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.message{max-width:85%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45;word-wrap:break-word;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.message.scam{background:#1e2630;align-self:flex-start;border-bottom-left-radius:4px;color:#c9d4e0}
.message.user{background:#2b5278;align-self:flex-end;border-bottom-right-radius:4px;color:#eaf0f6}
.message.system{background:#1c2128;align-self:center;text-align:center;font-size:12px;color:#8b98a8;padding:6px 16px;border-radius:20px;max-width:90%}
.message.threat{border-left:3px solid #d32f2f}
.actions{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;border-top:1px solid #2a313c;background:#0f1318}
.btn{padding:14px 20px;border-radius:14px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.btn:active{transform:scale(.98)}
.btn-primary{background:#2b5278;color:#fff}
.btn-primary:hover{background:#3a6a99}
.btn-danger{background:#d32f2f;color:#fff}
.btn-danger:hover{background:#e04545}
.btn-secondary{background:#2a313c;color:#c9d4e0}
.btn-secondary:hover{background:#3a4350}
.btn-good{background:#2e7d32;color:#fff}
.btn-good:hover{background:#388e3c}
.choice-row{display:flex;flex-direction:column;gap:8px}
.ending-card{background:#1a2129;border-radius:16px;padding:24px 20px;text-align:center;border:1px solid #2a313c;animation:fadeIn .4s ease}
.ending-card .icon{font-size:40px;margin-bottom:12px}
.ending-card h2{color:#e1e8ed;margin:0 0 10px;font-size:18px}
.ending-card p{color:#8b98a8;font-size:14px;line-height:1.6;margin:0 0 16px}
.ending-card .highlight{color:#ff6b6b;font-weight:700;font-size:16px}
.ending-card .highlight-good{color:#4caf50;font-weight:700;font-size:16px}
.ending-card .article{background:#0f1318;padding:10px 14px;border-radius:12px;margin:12px 0;font-size:14px;color:#c9d4e0}
.ending-card .article strong{color:#ff8a8a}
.legal-warning{font-size:12px;color:#6c7a8a;margin-top:14px;line-height:1.5}
.typing-indicator{display:flex;gap:4px;padding:10px 14px;align-self:flex-start;background:#1e2630;border-radius:18px;border-bottom-left-radius:4px}
.typing-indicator span{width:8px;height:8px;background:#4a5a6a;border-radius:50%;animation:typing 1.4s infinite ease-in-out}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a313c;border-radius:4px}
</style>
</head>
<body>
<div class="app">
<div class="intro" id="intro">
<div class="phone">
<div class="phone-title">СООБЩЕНИЯ</div>
<div class="phone-screen">
<div class="notif" id="notif">
<div class="nicon">💬</div>
<div class="ntext"><strong>Неизвестный</strong>Привет. Есть разговор. Напиши мне.</div>
<div class="badge">1</div>
</div>
</div>
</div>
<div class="hint">Нажми на сообщение, чтобы открыть чат</div>
</div>
<div class="header">
<div class="avatar">👤</div>
<div class="header-info">
<div class="name" id="contactName">Неизвестный</div>
<div class="status" id="contactStatus">в сети</div>
</div>
</div>
<div class="chat" id="chat"></div>
<div class="actions" id="actions"></div>
</div>
<script>
// === СЦЕНАРИЙ: НА КАЖДОМ ШАГЕ РЕПЛИКА МОШЕННИКА + ВАРИАНТЫ ОТВЕТА ===
const steps={
s1:{
scam:'Привет. Ты ведь Артём? Я по поводу работы. Есть хороший вариант, но нужно доверие.',
options:[
{label:'Да, я Артём. Что за работа?',next:'s2'},
{label:'Кто вы такой?',next:'s2b'},
{label:'Заблокировать',next:'end_good'}
]
},
s2b:{
scam:'Неважно кто я. Важно, что у тебя проблемы. Твои данные слиты в сеть.',
options:[
{label:'Какие данные?',next:'s3'},
{label:'И что делать?',next:'s3'},
{label:'Заблокировать',next:'end_good'}
]
},
s2:{
scam:'Работа простая. Нужно выполнить одно небольшое дело. Оплата сразу.',
options:[
{label:'И что делать?',next:'s3'},
{label:'Какое ещё дело?',next:'s3'},
{label:'Заблокировать',next:'end_good'}
]
},
s3:{
scam:'Мы видим, что с твоего номера были звонки в запрещённые организации. Это статья 205 УК РФ — пособничество терроризму.',
options:[
{label:'Это ошибка! Я никуда не звонил!',next:'s4'},
{label:'И что теперь делать?',next:'s4'},
{label:'Я не буду в этом участвовать',next:'s4b'},
{label:'Заблокировать',next:'end_good'}
]
},
s4b:{
scam:'Поздно отказываться. Данные уже в базе. Но есть способ удалить их.',
options:[
{label:'Какой способ?',next:'s4'},
{label:'Я не буду этого делать',next:'s5'},
{label:'Заблокировать',next:'end_good'}
]
},
s4:{
scam:'Нужно поджечь заправку на выезде из города. Это отвлечёт внимание, и мы удалим твои данные.',
options:[
{label:'Я не буду этого делать',next:'s5'},
{label:'Вы серьёзно? Это же преступление',next:'s5'},
{label:'Хорошо, я согласен',next:'s6'},
{label:'Заблокировать',next:'end_good'}
]
},
s5:{
scam:'Тогда завтра твои данные уйдут в следственный комитет. Статья 205, часть 2. От 12 до 20 лет. Ты готов?',
options:[
{label:'Это шантаж',next:'s6b'},
{label:'Я не буду этого делать',next:'s6b'},
{label:'Ладно, я согласен',next:'s6'},
{label:'Заблокировать',next:'end_good'}
]
},
s6b:{
scam:'Последнее предупреждение. Либо ты делаешь, либо мы передаём дело. У тебя 10 минут.',
options:[
{label:'Хорошо, я сделаю',next:'s6'},
{label:'Я не буду этого делать',next:'end_bad'},
{label:'Заблокировать',next:'end_good'}
]
},
s6:{
scam:'Умное решение. Адрес: выезд из города, заправка №4. Возьми канистру с бензином. Жду сигнала.',
options:[
{label:'Хорошо',next:'s7'},
{label:'Я передумал',next:'end_bad'},
{label:'Заблокировать',next:'end_good'}
]
},
s7:{
scam:'Сигнал получен. Но твои действия попали на камеры. Теперь это уже не удалить.',
options:[
{label:'Что?! Вы обещали!',next:'end_bad'},
{label:'Это подстава!',next:'end_bad'},
{label:'Заблокировать',next:'end_good'}
]
}
};

// === ФИНАЛЫ ===
const endingBad={
article:'Статья 205 УК РФ — Террористический акт',
text:'Суд признал вас виновным в совершении террористического акта (поджог по заданию неустановленных лиц).',
sentence:'Наказание: лишение свободы на срок от 10 до 15 лет.',
warning:'Помните: мошенники используют страх и угрозы. Если с вами или вашими близкими произошла подобная ситуация — немедленно обратитесь в полицию.',
legal:'Настоящие сотрудники банка или правоохранительных органов никогда не требуют совершать преступления.'
};

const endingGood={
title:'Вы заблокировали мошенника',
text:'Вы не поддались на угрозы и заблокировали чат. Мошенник не получил от вас ни денег, ни действий.',
highlight:'Ничего не произошло. Вы в безопасности.',
warning:'Если с вами или вашими близкими произошла подобная ситуация — немедленно обратитесь в полицию. Ничего не будет, если ничего не было.',
legal:'Настоящие сотрудники банка или правоохранительных органов никогда не требуют совершать преступления.'
};

// === ЛОГИКА ПРИЛОЖЕНИЯ ===
let blocked=false;
const chatEl=document.getElementById('chat');
const actionsEl=document.getElementById('actions');
const introEl=document.getElementById('intro');
const notifEl=document.getElementById('notif');
const contactNameEl=document.getElementById('contactName');
const contactStatusEl=document.getElementById('contactStatus');

function scrollToBottom(){chatEl.scrollTop=chatEl.scrollHeight;}

function addMessage(type,text){
const div=document.createElement('div');
div.className='message '+type;
if(type==='scam'&&(text.includes('205')||text.includes('статья')||text.includes('комитет')||text.includes('ФСБ')))div.classList.add('threat');
div.textContent=text;
chatEl.appendChild(div);
scrollToBottom();
}

function showTyping(){
const div=document.createElement('div');
div.className='typing-indicator';
div.id='typing';
div.innerHTML='<span></span><span></span><span></span>';
chatEl.appendChild(div);
scrollToBottom();
}

function removeTyping(){
const el=document.getElementById('typing');
if(el)el.remove();
}

function clearActions(){actionsEl.innerHTML='';}

// Открытие чата по тапу на уведомление
notifEl.addEventListener('click',function(){
introEl.classList.add('hide');
setTimeout(function(){introEl.style.display='none';},500);
startChat();
});

function startChat(){
contactNameEl.textContent='Неизвестный';
contactStatusEl.textContent='в сети';
blocked=false;
clearActions();
showStep('s1');
}

// Показ шага: сначала печатает мошенник, потом варианты ответа
function showStep(id){
if(blocked)return;
if(id==='end_bad'){showBadEnding();return;}
if(id==='end_good'){showGoodEnding();return;}

const step=steps[id];
if(!step){showBadEnding();return;}

clearActions();
showTyping();

setTimeout(function(){
removeTyping();
addMessage('scam',step.scam);
renderChoices(step.options);
},900);
}

// Варианты ответа игрока
function renderChoices(options){
clearActions();
const row=document.createElement('div');
row.className='choice-row';

options.forEach(function(opt){
let cls='btn-secondary';
if(opt.next==='end_good')cls='btn-good';
else if(opt.next==='end_bad')cls='btn-danger';
else if(opt.next==='s6')cls='btn-danger';

const btn=document.createElement('button');
btn.className='btn '+cls;
btn.textContent=opt.label;
btn.onclick=function(){
addMessage('user',opt.label);
clearActions();

if(opt.next==='end_good'){
setTimeout(function(){showGoodEnding();},600);
return;
}
setTimeout(function(){showStep(opt.next);},700);
};
row.appendChild(btn);
});

actionsEl.appendChild(row);
}

// Плохой финал
function showBadEnding(){
blocked=true;
chatEl.innerHTML='';
contactStatusEl.textContent='не в сети';
addMessage('system','Вас задержали. Следственный комитет предъявил обвинение.');

setTimeout(function(){
const card=document.createElement('div');
card.className='ending-card';
const icon=document.createElement('div');
icon.className='icon';
icon.textContent='🚨';
const h2=document.createElement('h2');
h2.textContent='Вас нашли и арестовали';
const p=document.createElement('p');
p.textContent='Следственный комитет предъявил обвинение по статье:';
const articleDiv=document.createElement('div');
articleDiv.className='article';
articleDiv.innerHTML='<strong>'+endingBad.article+'</strong><br>'+
'<span style="font-size:13px;color:#8b98a8;">'+endingBad.text+'</span><br><br>'+
'<span class="highlight">'+endingBad.sentence+'</span>';
const warningP=document.createElement('p');
warningP.style.marginTop='16px';
warningP.style.fontSize='13px';
warningP.style.color='#8b98a8';
warningP.textContent=endingBad.warning;
const legal=document.createElement('div');
legal.className='legal-warning';
legal.textContent=endingBad.legal;
card.appendChild(icon);
card.appendChild(h2);
card.appendChild(p);
card.appendChild(articleDiv);
card.appendChild(warningP);
card.appendChild(legal);
chatEl.appendChild(card);
scrollToBottom();
renderEndButtons();
},700);
}

// Хороший финал
function showGoodEnding(){
blocked=true;
chatEl.innerHTML='';
contactStatusEl.textContent='заблокирован';
addMessage('system','Вы заблокировали этот чат.');

setTimeout(function(){
const card=document.createElement('div');
card.className='ending-card';
const icon=document.createElement('div');
icon.className='icon';
icon.textContent='🛡️';
const h2=document.createElement('h2');
h2.textContent=endingGood.title;
const p=document.createElement('p');
p.textContent=endingGood.text;
const articleDiv=document.createElement('div');
articleDiv.className='article';
articleDiv.innerHTML='<span class="highlight-good">'+endingGood.highlight+'</span>';
const warningP=document.createElement('p');
warningP.style.marginTop='16px';
warningP.style.fontSize='13px';
warningP.style.color='#8b98a8';
warningP.textContent=endingGood.warning;
const legal=document.createElement('div');
legal.className='legal-warning';
legal.textContent=endingGood.legal;
card.appendChild(icon);
card.appendChild(h2);
card.appendChild(p);
card.appendChild(articleDiv);
card.appendChild(warningP);
card.appendChild(legal);
chatEl.appendChild(card);
scrollToBottom();
renderEndButtons();
},700);
}

// Кнопки после финала
function renderEndButtons(){
clearActions();

const btnEnd=document.createElement('button');
btnEnd.className='btn btn-danger';
btnEnd.textContent='Закончить';
btnEnd.onclick=function(){
window.close();
alert('Спасибо. Помните: настоящие мошенники используют страх. Не поддавайтесь.');
};

const btnRestart=document.createElement('button');
btnRestart.className='btn btn-secondary';
btnRestart.textContent='Повторить';
btnRestart.onclick=function(){
chatEl.innerHTML='';
clearActions();
blocked=false;
contactStatusEl.textContent='в сети';
showStep('s1');
};

actionsEl.appendChild(btnEnd);
actionsEl.appendChild(btnRestart);
}
</script>
</body>
  </html>
